name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet ./...
          go build ./...
          go test -count=1 -covermode=count -coverprofile=coverage.out ./...

  openssl-interop:
    name: OpenSSL 3.6 Interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENSSL_VERSION: 3.6.3
      OPENSSL_SHA256: 243a86649cf6f23eeb6a2ff2456e09e5d77dd9018a54d3d96b0c6bdd6ba6c7f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build OpenSSL with PQC CMS support
        run: |
          archive="${RUNNER_TEMP}/openssl-${OPENSSL_VERSION}.tar.gz"
          source_dir="${RUNNER_TEMP}/openssl-${OPENSSL_VERSION}"
          install_dir="${RUNNER_TEMP}/openssl-install-${OPENSSL_VERSION}"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          cd "${source_dir}"
          ./Configure --prefix="${install_dir}" --openssldir="${install_dir}/ssl" no-tests
          make -j2
          make install_sw
          make install_ssldirs
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
      - name: Test PQC CMS interoperability
        env:
          PKCS7_OPENSSL_INTEROP: "1"
        run: |
          openssl version
          go test -count=1 -run '^TestOpenSSL.*Interoperability$' -v ./...

  legacy-test:
    name: Legacy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet -tags=legacy ./...
          go build -tags=legacy ./...
          go test -tags=legacy -count=1 ./... -run "^TestLegacy.*$"
